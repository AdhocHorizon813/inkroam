<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>波动方程 · 几何可视化</title>
<style>
:root{color-scheme:light dark;--bg:#0f1419;--fg:#e7ecf3;--muted:#8b9bb4;--accent:#5b9dff;--card:#1a2332;--border:#2a3548;font-family:system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fb;--fg:#1a2332;--muted:#5a6a82;--card:#fff;--border:#d8e0ec}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);line-height:1.5;padding:1rem}
h1{font-size:1.25rem;margin:0 0 .5rem}p{margin:.25rem 0;color:var(--muted);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin:1rem 0}
label{display:block;font-size:.85rem;margin:.5rem 0 .2rem}input[type=range]{width:100%}
canvas{width:100%;max-width:640px;height:auto;background:#111;border-radius:8px;display:block;margin:.5rem auto}
.row{display:flex;gap:1rem;flex-wrap:wrap}.row>div{flex:1;min-width:180px}
</style></head>
<body>
<h1>高维波动方程 · 几何可视化（离线）</h1>
<p>三个可调实验：球面平均、球面投影面积倍率、推迟时刻。无需联网。</p>
<div class="panel"><h2>1. 球面平均 M<sub>h</sub>(x,r)</h2>
<p>示例 h(y)=|y|²，球心在原点附近时 M = |x|² + r²。</p>
<div class="row"><div><label>半径 r <span id="rVal">1.0</span></label><input id="r" type="range" min="0.05" max="3" step="0.05" value="1"></div></div>
<canvas id="c1" width="640" height="320"></canvas></div>
<div class="panel"><h2>2. 球面投影到圆盘</h2>
<p>面积倍率 R / √(R²−ρ²)，边缘处增大。</p>
<div class="row"><div><label>相对半径 ρ/R <span id="rhoVal">0.5</span></label><input id="rho" type="range" min="0" max="0.98" step="0.01" value="0.5"></div></div>
<canvas id="c2" width="640" height="320"></canvas></div>
<div class="panel"><h2>3. 推迟时刻 τ = t − d/a</h2>
<p>若 d > a t，从 t=0 开始的源尚不能影响观察点。</p>
<div class="row"><div><label>波速 a <span id="aVal">1</span></label><input id="a" type="range" min="0.5" max="3" step="0.1" value="1"></div>
<div><label>观察时刻 t <span id="tVal">2</span></label><input id="t" type="range" min="0.2" max="5" step="0.1" value="2"></div>
<div><label>源距离 d <span id="dVal">1.5</span></label><input id="d" type="range" min="0" max="6" step="0.1" value="1.5"></div></div>
<canvas id="c3" width="640" height="240"></canvas>
<p id="tauOut"></p></div>
<script>
"use strict";
const ui=Object.fromEntries(["r","rVal","c1","rho","rhoVal","c2","a","aVal","t","tVal","d","dVal","c3","tauOut"].map(id=>[id,document.getElementById(id)]));
function drawMean(){const r=+ui.r.value;ui.rVal.textContent=r.toFixed(2);const c=ui.c1.getContext("2d"),w=ui.c1.width,h=ui.c1.height;c.clearRect(0,0,w,h);c.fillStyle="#1a2332";c.fillRect(0,0,w,h);const cx=w/2,cy=h/2,scale=40;c.strokeStyle="#5b9dff";c.beginPath();c.arc(cx,cy,r*scale,0,Math.PI*2);c.stroke();c.fillStyle="#e7ecf3";c.beginPath();c.arc(cx,cy,3,0,Math.PI*2);c.fill();c.fillStyle="#8b9bb4";c.font="14px system-ui";c.fillText("M ≈ |x|² + r² = "+(r*r).toFixed(2)+" (x=0)",16,24)}
ui.r.oninput=drawMean;drawMean();
function drawProj(){const rho=+ui.rho.value;ui.rhoVal.textContent=rho.toFixed(2);const c=ui.c2.getContext("2d"),w=ui.c2.width,h=ui.c2.height;c.clearRect(0,0,w,h);c.fillStyle="#1a2332";c.fillRect(0,0,w,h);const R=100,cx=w/2,cy=h/2;c.strokeStyle="#5b9dff";c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.stroke();const factor=1/Math.sqrt(1-rho*rho);c.fillStyle="#8b9bb4";c.font="14px system-ui";c.fillText("倍率 ≈ "+factor.toFixed(2),16,24);c.beginPath();c.arc(cx+rho*R,cy,4,0,Math.PI*2);c.fillStyle="#ff8b5b";c.fill()}
ui.rho.oninput=drawProj;drawProj();
function drawTau(){const a=+ui.a.value,t=+ui.t.value,d=+ui.d.value;ui.aVal.textContent=a.toFixed(1);ui.tVal.textContent=t.toFixed(1);ui.dVal.textContent=d.toFixed(1);const tau=t-d/a;const reachable=d<=a*t;ui.tauOut.textContent=reachable?("τ = "+tau.toFixed(2)+" （可到达）"):("d > a t，源尚未影响观察点");const c=ui.c3.getContext("2d"),w=ui.c3.width,h=ui.c3.height;c.clearRect(0,0,w,h);c.fillStyle="#1a2332";c.fillRect(0,0,w,h);c.strokeStyle="#5b9dff";c.beginPath();c.moveTo(40,h-40);c.lineTo(w-20,h-40);c.moveTo(40,h-40);c.lineTo(40,20);c.stroke();c.fillStyle="#8b9bb4";c.font="12px system-ui";c.fillText("空间",w-50,h-20);c.fillText("时间",10,30);const maxD=6,maxT=5;const sx=(w-60)/maxD,sy=(h-60)/maxT;c.strokeStyle="#ff8b5b";c.beginPath();c.moveTo(40,h-40);c.lineTo(40+a*t*sx,h-40-t*sy);c.stroke();c.fillStyle=reachable?"#5b9dff":"#ff5b5b";c.beginPath();c.arc(40+d*sx,h-40-t*sy,5,0,Math.PI*2);c.fill()}
ui.a.oninput=ui.t.oninput=ui.d.oninput=drawTau;drawTau();
</script>
</body>
</html>
