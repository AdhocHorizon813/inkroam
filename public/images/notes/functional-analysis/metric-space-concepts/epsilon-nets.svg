<svg class="concept-svg" xmlns="http://www.w3.org/2000/svg" width="736" height="620" viewBox="0 0 736 620" role="img" aria-labelledby="metric-net-title metric-net-desc"><style>svg{--background:#fcfcfd;--foreground:#232a33;--muted:#f0f2f5;--border:#d3d8e0;--muted-foreground:#5d6673;--viz-series-1:#4268ad}text{fill:var(--foreground);font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:400}.node-title{font-weight:500}.node-sub,.edge-label{font-size:12px}.edge{fill:none;stroke:var(--muted-foreground);stroke-width:1.5}.node-box{fill:var(--muted);stroke:var(--border);stroke-width:1}.key-box{fill:color-mix(in srgb,var(--viz-series-1) 10%,var(--background));stroke:var(--border);stroke-width:1}.equation-bg{fill:var(--background)}@media(prefers-color-scheme:dark){svg{--background:#191e29;--foreground:#e8edf6;--muted:#252d3b;--border:#485365;--muted-foreground:#b3bdcc;--viz-series-1:#9bbcff}}</style><rect width="736" height="620" fill="var(--background)"/><title id="metric-net-title">ε网、全有界、稠密与可分</title><desc id="metric-net-desc">ε网是以网点为中心的ε开球覆盖目标集合。全有界要求每个ε都有一个有限网，网可随ε改变。N在A中稠密，等价于同一个N对任意ε都是A的ε网。全有界推出可分。若N包含于A并至多可数，N在A中稠密也推出A可分。</desc><defs><marker id="metric-net-base" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.3"/></marker><marker id="metric-net-extra" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--viz-series-1)" stroke-width="1.3"/></marker></defs><path class="edge" d="M 184 335 C 184 430 326 435 326 497" marker-end="url(#metric-net-base)"/><path class="edge" d="M 552 335 C 552 430 410 435 410 497" marker-end="url(#metric-net-base)"/><rect class="equation-bg" x="49" y="382" width="270" height="51"/><rect class="equation-bg" x="417" y="382" width="270" height="51"/><text x="184" y="400" text-anchor="middle" class="edge-label">各有限网取在 A 内</text><text x="184" y="421" text-anchor="middle" class="edge-label">D = ⋃ₖ N₁/ₖ ⊆ A</text><text x="552" y="400" text-anchor="middle" class="edge-label">再加 N ⊆ A</text><text x="552" y="421" text-anchor="middle" class="edge-label">且 N 至多可数</text><g data-concept="net"><rect x="88" y="18" width="560" height="114" rx="10" class="key-box"/><text x="368" y="49" text-anchor="middle" class="node-title">N 是 A 的 ε 网</text><text x="368" y="72" text-anchor="middle" class="node-sub">A ⊆ ⋃ₙ∈N B(n, ε)</text><text x="368" y="91" text-anchor="middle" class="node-sub">用半径 ε 的开球覆盖 A</text><text x="368" y="110" text-anchor="middle" class="node-sub">N ⊆ X；不要求有限</text></g><g data-concept="total"><rect x="49" y="221" width="270" height="114" rx="10" class="node-box"/><text x="184" y="252" text-anchor="middle" class="node-title">全有界 A</text><text x="184" y="275" text-anchor="middle" class="node-sub">每个 ε &gt; 0</text><text x="184" y="294" text-anchor="middle" class="node-sub">都存在有限 ε 网 Nε</text><text x="184" y="313" text-anchor="middle" class="node-sub">Nε 可随 ε 改变</text></g><g data-concept="dense"><rect x="417" y="221" width="270" height="114" rx="10" class="node-box"/><text x="552" y="252" text-anchor="middle" class="node-title">N 在 A 中稠密</text><text x="552" y="275" text-anchor="middle" class="node-sub">A ⊆ N̄</text><text x="552" y="294" text-anchor="middle" class="node-sub">同一 N 对每个 ε &gt; 0</text><text x="552" y="313" text-anchor="middle" class="node-sub">都是 A 的 ε 网</text></g><g data-concept="separable"><rect x="183" y="497" width="370" height="102" rx="10" class="key-box"/><text x="368" y="531" text-anchor="middle" class="node-title">可分 A</text><text x="368" y="554" text-anchor="middle" class="node-sub">存在至多可数 D ⊆ A</text><text x="368" y="573" text-anchor="middle" class="node-sub">且 D 在 A 中稠密</text></g></svg>
