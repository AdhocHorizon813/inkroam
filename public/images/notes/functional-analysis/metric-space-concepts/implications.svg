<svg class="concept-svg" xmlns="http://www.w3.org/2000/svg" width="736" height="775" viewBox="0 0 736 775" role="img" aria-labelledby="metric-main-title metric-main-desc"><style>svg{--background:#fcfcfd;--foreground:#232a33;--muted:#f0f2f5;--border:#d3d8e0;--muted-foreground:#5d6673;--viz-series-1:#4268ad}text{fill:var(--foreground);font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:400}.node-title{font-weight:500}.node-sub,.edge-label{font-size:12px}.edge{fill:none;stroke:var(--muted-foreground);stroke-width:1.5}.node-box{fill:var(--muted);stroke:var(--border);stroke-width:1}.key-box{fill:color-mix(in srgb,var(--viz-series-1) 10%,var(--background));stroke:var(--border);stroke-width:1}.equation-bg{fill:var(--background)}@media(prefers-color-scheme:dark){svg{--background:#191e29;--foreground:#e8edf6;--muted:#252d3b;--border:#485365;--muted-foreground:#b3bdcc;--viz-series-1:#9bbcff}}</style><rect width="736" height="775" fill="var(--background)"/><title id="metric-main-title">集合性质的推导关系</title><desc id="metric-main-desc">紧集推出闭、完备和列紧。完备推出闭。列紧等价于闭包紧，并推出全有界。全有界推出有界和可分。紧等价于完备且全有界，也等价于闭且列紧。环境完备时增加全有界到列紧及闭到完备的逆推；欧氏空间还增加有界到全有界。</desc><defs><marker id="metric-main-base" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.3"/></marker><marker id="metric-main-extra" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--viz-series-1)" stroke-width="1.3"/></marker></defs><path class="edge" d="M 320 91 C 320 119 125.12 118 125.12 157" marker-end="url(#metric-main-base)"/><path class="edge" d="M 368 91 L 368 157" marker-end="url(#metric-main-base)"/><path class="edge" d="M 416 91 C 416 119 610.88 118 610.88 157" marker-end="url(#metric-main-base)"/><path class="edge" d="M 266 198 L 227.12 198" marker-end="url(#metric-main-base)"/><path class="edge" d="M 606.88 239 L 606.88 309" marker-end="url(#metric-main-base)"/><path class="edge" d="M 614.88 309 L 614.88 239" marker-end="url(#metric-main-base)"/><path class="edge" d="M 530.88 239 C 530.88 332 394 346 394 446" marker-end="url(#metric-main-base)"/><path class="edge" d="M 333 528 C 333 559 184 553 184 589" marker-end="url(#metric-main-base)"/><path class="edge" d="M 403 528 C 403 559 552 553 552 589" marker-end="url(#metric-main-base)"/><text x="198.72000000000003" y="722" text-anchor="middle" class="node-title">紧 ⇔ 完备 ＋ 全有界</text><text x="537.28" y="722" text-anchor="middle" class="node-title">紧 ⇔ 闭 ＋ 列紧</text><text x="368" y="755" text-anchor="middle" class="edge-label">＋ 表示两个条件同时满足</text><g data-concept="compact"><rect x="266" y="9" width="204" height="82" rx="10" class="key-box"/><text x="368" y="42" text-anchor="middle" class="node-title">紧 A</text><text x="368" y="65" text-anchor="middle" class="node-sub">任意开覆盖都有有限子覆盖</text></g><g data-concept="closed"><rect x="23.120000000000005" y="157" width="204" height="82" rx="10" class="node-box"/><text x="125.12" y="190" text-anchor="middle" class="node-title">A 在 X 中闭</text><text x="125.12" y="213" text-anchor="middle" class="node-sub">包含自身全部极限点</text></g><g data-concept="complete"><rect x="266" y="157" width="204" height="82" rx="10" class="node-box"/><text x="368" y="190" text-anchor="middle" class="node-title">完备 A</text><text x="368" y="213" text-anchor="middle" class="node-sub">Cauchy 列在 A 中收敛</text></g><g data-concept="relative"><rect x="508.88" y="157" width="204" height="82" rx="10" class="node-box"/><text x="610.88" y="190" text-anchor="middle" class="node-title">列紧 A</text><text x="610.88" y="213" text-anchor="middle" class="node-sub">任意点列有子列在 X 中收敛</text></g><g data-concept="closure"><rect x="508.88" y="309" width="204" height="82" rx="10" class="node-box"/><text x="610.88" y="342" text-anchor="middle" class="node-title">闭包 Ā 紧</text><text x="610.88" y="365" text-anchor="middle" class="node-sub">A 的闭包在 X 中为紧集</text></g><g data-concept="total"><rect x="266" y="446" width="204" height="82" rx="10" class="node-box"/><text x="368" y="479" text-anchor="middle" class="node-title">全有界 A</text><text x="368" y="502" text-anchor="middle" class="node-sub">每个 ε &gt; 0 都有有限 ε 网</text></g><g data-concept="bounded"><rect x="82" y="589" width="204" height="82" rx="10" class="node-box"/><text x="184" y="622" text-anchor="middle" class="node-title">有界 A</text><text x="184" y="645" text-anchor="middle" class="node-sub">一个有限半径球可覆盖 A</text></g><g data-concept="separable"><rect x="450" y="589" width="204" height="82" rx="10" class="node-box"/><text x="552" y="622" text-anchor="middle" class="node-title">可分 A</text><text x="552" y="645" text-anchor="middle" class="node-sub">有至多可数的稠密子集</text></g></svg>
