<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#0f1419"/>
  <text x="24" y="28" fill="#e7ecf3" font-family="system-ui" font-size="16" font-weight="600">奇延拓：对称区间抵消后只保留 at 附近短区间</text>
  <line x1="60" y1="200" x2="840" y2="200" stroke="#3a4a60" stroke-width="1"/>
  <line x1="450" y1="40" x2="450" y2="320" stroke="#3a4a60" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- odd function sketch G(s)=s -->
  <path d="M100 280 L450 200 L800 120" fill="none" stroke="#5b9dff" stroke-width="2.5"/>
  <text x="70" y="300" fill="#8b9bb4" font-size="13">−(at−r)</text>
  <text x="420" y="330" fill="#8b9bb4" font-size="13">0</text>
  <text x="780" y="100" fill="#8b9bb4" font-size="13">at+r</text>
  <rect x="380" y="150" width="140" height="100" fill="#5b9dff" fill-opacity="0.15" stroke="#5b9dff" stroke-width="1.5"/>
  <text x="400" y="140" fill="#ff8b5b" font-size="13">保留 [at−r, at+r]</text>
  <text x="24" y="340" fill="#8b9bb4" font-size="13">奇函数在中间对称区间积分为零（示例 G(s)=s, at=3, r=0.7）</text>
</svg>
