<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#0f1419"/>
  <text x="24" y="28" fill="#e7ecf3" font-family="system-ui" font-size="16" font-weight="600">球面投影到圆盘：面积倍率在边缘增大</text>
  <!-- left: sphere cross-section -->
  <g transform="translate(220,220)">
    <ellipse rx="140" ry="90" fill="none" stroke="#5b9dff" stroke-width="2"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#3a4a60" stroke-width="1"/>
    <circle cx="70" cy="-55" r="4" fill="#ff8b5b"/>
    <circle cx="70" cy="55" r="4" fill="#ff8b5b"/>
    <line x1="70" y1="-55" x2="70" y2="55" stroke="#ff8b5b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-40" y="120" fill="#8b9bb4" font-size="13">上下半球 → 同一投影点</text>
  </g>
  <!-- right: factor plot -->
  <g transform="translate(520,80)">
    <line x1="0" y1="250" x2="300" y2="250" stroke="#3a4a60"/>
    <line x1="0" y1="250" x2="0" y2="30" stroke="#3a4a60"/>
    <path d="M0 200 C80 180 160 120 280 40" fill="none" stroke="#5b9dff" stroke-width="2.5"/>
    <text x="220" y="270" fill="#8b9bb4" font-size="13">ρ/R</text>
    <text x="10" y="50" fill="#8b9bb4" font-size="13">R/√(R²−ρ²)</text>
    <text x="40" y="160" fill="#ff8b5b" font-size="13">边缘陡峭 → 倍率↑</text>
  </g>
</svg>
