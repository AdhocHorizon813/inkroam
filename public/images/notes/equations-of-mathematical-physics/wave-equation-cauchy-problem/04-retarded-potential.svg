<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#0f1419"/>
  <text x="24" y="28" fill="#e7ecf3" font-family="system-ui" font-size="16" font-weight="600">推迟时刻与球壳叠加</text>
  <!-- spacetime cone section -->
  <g transform="translate(80,60)">
    <line x1="40" y1="280" x2="360" y2="280" stroke="#3a4a60"/>
    <line x1="40" y1="280" x2="40" y2="40" stroke="#3a4a60"/>
    <text x="340" y="300" fill="#8b9bb4" font-size="13">空间</text>
    <text x="10" y="50" fill="#8b9bb4" font-size="13">τ</text>
    <path d="M40 280 L200 80 L360 280" fill="none" stroke="#5b9dff" stroke-width="2"/>
    <circle cx="160" cy="160" r="5" fill="#ff8b5b"/>
    <text x="170" y="155" fill="#ff8b5b" font-size="13">源点</text>
  </g>
  <!-- concentric shells -->
  <g transform="translate(520,200)">
    <circle r="40" fill="none" stroke="#5b9dff" stroke-width="1.5" opacity="0.9"/>
    <circle r="70" fill="none" stroke="#5b9dff" stroke-width="1.5" opacity="0.6"/>
    <circle r="100" fill="none" stroke="#5b9dff" stroke-width="1.5" opacity="0.35"/>
    <circle r="4" fill="#e7ecf3"/>
    <text x="-40" y="130" fill="#8b9bb4" font-size="13">较早源 → 较大半径</text>
    <text x="-30" y="-120" fill="#8b9bb4" font-size="13">τ = t − |y−x|/a</text>
  </g>
</svg>
