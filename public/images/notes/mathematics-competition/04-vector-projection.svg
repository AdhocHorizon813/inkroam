<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" role="img" aria-labelledby="title desc"><title id="title">向量分解与有向面积</title><desc id="desc">向量 a 等于其水平投影与垂直分量之和；右侧平行四边形面积为八，交换两边顺序使有向面积变号。</desc><rect width="950" height="380" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif"><text x="35" y="40" font-size="21" fill="#172b4d">正交分解：沿方向与垂直方向</text><line x1="65" y1="285" x2="373" y2="285" stroke="#526479" stroke-width="2"/><polygon points="373,285 363,281 363,289" fill="#526479"/><line x1="65" y1="285" x2="65" y2="89" stroke="#526479" stroke-width="2"/><polygon points="65,89 61,99 69,99" fill="#526479"/><line x1="65" y1="285" x2="275" y2="145" stroke="#2166b5" stroke-width="2"/><polygon points="275,145 264.4606962717207,147.2188007849009 268.8982978415225,153.87520313960368" fill="#2166b5"/><line x1="65" y1="285" x2="275" y2="285" stroke="#16806a" stroke-width="2"/><polygon points="275,285 265,281 265,289" fill="#16806a"/><line x1="275" y1="285" x2="275" y2="145" stroke="#c45a18" stroke-width="2"/><polygon points="275,145 271,155 279,155" fill="#c45a18"/><polyline points="261.00,285.00 261.00,271.00 275.00,271.00" fill="none" stroke="#526479" stroke-width="1.5" stroke-linejoin="round"/><text x="150" y="120" font-size="18" fill="#2166b5">a = (3, 2)</text><text x="142" y="314" font-size="17" fill="#16806a">a∥ = (3, 0)</text><text x="285" y="208" font-size="18" fill="#c45a18">a⊥</text><text x="365" y="280" font-size="18" fill="#172b4d">b</text><text x="50" y="310" font-size="16" fill="#172b4d">O</text><text x="470" y="40" font-size="21" fill="#172b4d">面积与取向</text><polygon points="470,285 710,285 890,165 650,165" fill="#deebf8" stroke="#2166b5" stroke-width="2"/><line x1="470" y1="285" x2="710" y2="285" stroke="#16806a" stroke-width="2"/><polygon points="710,285 700,281 700,289" fill="#16806a"/><line x1="470" y1="285" x2="650" y2="165" stroke="#2166b5" stroke-width="2"/><polygon points="650,165 639.4606962717206,167.2188007849009 643.8982978415225,173.87520313960368" fill="#2166b5"/><text x="580" y="310" font-size="17" fill="#16806a">b = (4, 0)</text><text x="525" y="140" font-size="17" fill="#2166b5">a = (3, 2)</text><text x="620" y="238" font-size="20" fill="#172b4d">面积 = 8</text><text x="470" y="350" font-size="18" fill="#172b4d">det(b, a) = 8；det(a, b) = −8</text></g></svg>
