<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">异面直线的公垂线</title><desc id="desc">两条直线方向分别为一零零和一一零，分别位于高度零和一；两垂足在 z 轴上，相距一。</desc><rect width="920" height="500" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif"><text x="35" y="40" font-size="23" fill="#172b4d">异面直线：求方向，也要求垂足</text><line x1="130" y1="330" x2="610" y2="330" stroke="#2166b5" stroke-width="2"/><line x1="82" y1="254.8" x2="640" y2="154" stroke="#16806a" stroke-width="2"/><line x1="330" y1="330" x2="330" y2="210" stroke="#c45a18" stroke-width="2"/><line x1="330" y1="378" x2="330" y2="162.00000000000003" stroke="#c45a18" stroke-width="2" stroke-dasharray="5 6"/><circle cx="330" cy="330" r="4" fill="#172b4d"/><circle cx="330" cy="210" r="4" fill="#172b4d"/><text x="350" y="355" font-size="18" fill="#172b4d">H₁ = (0, 0, 0)</text><text x="350" y="200" font-size="18" fill="#172b4d">H₂ = (0, 0, 1)</text><text x="60" y="375" font-size="19" fill="#2166b5">L₁ = (t, 0, 0)</text><text x="540" y="135" font-size="18" fill="#16806a">L₂ = (1+s, 1+s, 1)</text><text x="350" y="270" font-size="19" fill="#c45a18">距离 = 1</text><text x="35" y="430" font-size="20" fill="#172b4d">u × v = (0, 0, 1)；公垂线：x = 0，y = 0</text><text x="35" y="465" font-size="16" fill="#526479">斜投影示意；空间中的直角不一定在图上显示为直角。</text></g></svg>
